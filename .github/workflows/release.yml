name: Build and Release Android APK

on:
  release:
    types: [published, created]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag / Version Name (e.g. v1.2.4)'
        required: false
        default: 'v1.2.4'
      draft:
        description: 'Create draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 'wrapper'
          cache-read-only: false

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Prepare Environment Files
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
            echo "Created .env from .env.example"
          fi
          touch .env

      - name: Setup Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.SIGNING_KEY }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > my-upload-key.jks
            echo "Release keystore decoded from repository secret."
          else
            echo "Generating consistent release signing keystore for automated builds..."
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias chompclock \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "chompclock_release_pass" \
              -keypass "chompclock_release_pass" \
              -dname "CN=ChompClock, OU=Mobile, O=PASSK3YS, L=Global, S=CA, C=US"
            echo "STORE_PASSWORD=chompclock_release_pass" >> $GITHUB_ENV
            echo "KEY_ALIAS=chompclock" >> $GITHUB_ENV
            echo "KEY_PASSWORD=chompclock_release_pass" >> $GITHUB_ENV
          fi

      - name: Build Android APKs (Release & Debug)
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.STORE_PASSWORD || env.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || env.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || env.KEY_ALIAS }}
        run: |
          ./gradlew assembleRelease assembleDebug --stacktrace --no-daemon

      - name: Package and Organize Release Artifacts
        id: package_apks
        run: |
          mkdir -p build_output

          # Determine version name / tag
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="v1.2.4"
          fi
          echo "TARGET_TAG=$TAG" >> $GITHUB_ENV
          echo "Target tag is: $TAG"

          # Find release APK
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "build_output/ChompClock-${TAG}-release.apk"
            cp "$RELEASE_APK" "build_output/ChompClock-release.apk"
            echo "Release APK packaged: $RELEASE_APK"
          else
            echo "Warning: No release APK found in app/build/outputs/apk/release"
          fi

          # Find debug APK
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" "build_output/ChompClock-${TAG}-debug.apk"
            cp "$DEBUG_APK" "build_output/ChompClock-debug.apk"
            echo "Debug APK packaged: $DEBUG_APK"
          fi

          # Provide standard latest APK link
          if [ -f "build_output/ChompClock-release.apk" ]; then
            cp "build_output/ChompClock-release.apk" "build_output/ChompClock-latest.apk"
          elif [ -f "build_output/ChompClock-debug.apk" ]; then
            cp "build_output/ChompClock-debug.apk" "build_output/ChompClock-latest.apk"
          fi

          # Generate SHA256 Checksums
          cd build_output
          sha256sum *.apk > SHA256SUMS.txt || true
          cd ..

          echo "Listing packaged build outputs:"
          ls -la build_output/

      - name: Upload Build Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: ChompClock-APKs-${{ env.TARGET_TAG }}
          path: build_output/*
          retention-days: 30

      - name: Publish or Update GitHub Release Assets
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.TARGET_TAG }}
          IS_DRAFT: ${{ inputs.draft || false }}
          IS_PRERELEASE: ${{ inputs.prerelease || false }}
        run: |
          echo "Publishing release assets for tag: $TAG"

          # Check if the release already exists on GitHub
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists. Uploading and overwriting assets..."
            for file in build_output/*.apk build_output/SHA256SUMS.txt; do
              if [ -f "$file" ]; then
                echo "Uploading $file..."
                gh release upload "$TAG" "$file" --clobber
              fi
            done
          else
            echo "Release $TAG does not exist. Creating new release..."
            FLAGS=()
            if [ "$IS_DRAFT" = "true" ]; then
              FLAGS+=(--draft)
            fi
            if [ "$IS_PRERELEASE" = "true" ]; then
              FLAGS+=(--prerelease)
            fi

            gh release create "$TAG" build_output/*.apk build_output/SHA256SUMS.txt \
              --title "Release $TAG" \
              --generate-notes \
              "${FLAGS[@]}"
          fi
          echo "Release assets published successfully!"
